name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-checks:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate git convention
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python .github/scripts/validate_git_convention.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run automated review checks
        run: ./gradlew check pmdMain pmdTest checkstyleMain checkstyleTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-reports
          path: |
            build/reports/tests
            build/reports/checkstyle
            build/reports/pmd
