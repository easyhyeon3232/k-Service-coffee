name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-checks:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew test

      - name: Run Checkstyle
        id: checkstyle
        continue-on-error: true
        run: ./gradlew checkstyleMain

      - name: Run PMD
        id: pmd
        continue-on-error: true
        run: ./gradlew pmdMain

      - name: Validate git convention
        id: git-convention
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python .github/scripts/validate_git_convention.py > git-convention.log 2>&1

      - name: Build review summary
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(".")
          summary_path = root / "review-summary.md"

          def changed_files(base_ref: str, limit: int = 30) -> list[str]:
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--depth=1", "origin", base_ref],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              merge_base = subprocess.run(
                  ["git", "merge-base", f"origin/{base_ref}", "HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              output = subprocess.run(
                  ["git", "diff", "--name-only", f"{merge_base}..HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              return [line.strip() for line in output.splitlines() if line.strip()][:limit]

          def add_finding(items: list[str], path: Path, line_number: int, message: str) -> None:
              items.append(f"- `{path.as_posix()}:{line_number}` {message}")

          base_ref = os.environ["PR_BASE_REF"]
          pr_number = os.environ["PR_NUMBER"]
          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]

          changed = changed_files(base_ref)
          java_files = [
              Path(path)
              for path in changed
              if path.endswith(".java") and "src/main/java/" in path.replace("\\", "/")
          ]

          findings: list[str] = []

          for path in java_files:
              file_path = root / path
              if not file_path.exists():
                  continue

              lines = file_path.read_text(encoding="utf-8", errors="ignore").splitlines()
              content = "\n".join(lines)

              if "Controller" in path.name and "Repository" in content:
                  for index, line in enumerate(lines, start=1):
                      if "Repository" in line:
                          add_finding(
                              findings,
                              path,
                              index,
                              "컨트롤러에서 리포지토리를 직접 의존하는 것으로 보입니다. 서비스 계층으로 책임을 모으는 편이 안전합니다.",
                          )
                          break

              if (
                  "Service" in path.name
                  and ("order" in path.as_posix() or "point" in path.as_posix())
                  and not path.name.endswith("Test.java")
              ):
                  if "@Transactional" not in content:
                      add_finding(
                          findings,
                          path,
                          1,
                          "주문 또는 포인트 서비스인데 `@Transactional` 경계가 보이지 않습니다. 정합성 보장을 위해 확인이 필요합니다.",
                      )

              for index, line in enumerate(lines, start=1):
                  stripped = line.strip()

                  if "catch (Exception" in stripped:
                      add_finding(findings, path, index, "광범위한 `Exception` 처리 대신 구체적인 예외를 분리하는 것이 좋습니다.")

                  if "throw new RuntimeException" in stripped or "throw new IllegalArgumentException" in stripped:
                      add_finding(
                          findings,
                          path,
                          index,
                          "공통 에러 정책을 쓰고 있다면 `BusinessException`과 `ErrorCode` 기반으로 맞추는 편이 일관적입니다.",
                      )

                  if "System.out.println" in stripped or "printStackTrace()" in stripped:
                      add_finding(findings, path, index, "운영 코드에는 표준 출력 대신 로거를 사용하는 것이 좋습니다.")

                  if "@Autowired" in stripped:
                      add_finding(findings, path, index, "필드 주입보다 생성자 주입을 유지하는 편이 테스트와 불변성 측면에서 유리합니다.")

                  if "TODO" in stripped or "FIXME" in stripped:
                      add_finding(findings, path, index, "남아 있는 TODO/FIXME가 실제 배포 전 정리 대상인지 확인해보면 좋겠습니다.")

                  if "@RequestBody" in stripped and "@Valid" not in stripped:
                      add_finding(findings, path, index, "요청 DTO 검증이 필요하다면 `@Valid` 적용 여부를 확인해보면 좋겠습니다.")

          findings = findings[:20]

          lines: list[str] = []
          lines.append(f"<!-- pr-review-agent pr:{pr_number} run:{run_id} attempt:{run_attempt} -->")
          lines.append("## 자동 코드 리뷰 결과")
          lines.append("")
          lines.append(f"- PR 번호: `{pr_number}`")
          lines.append(f"- 실행 ID: `{run_id}`")
          lines.append(f"- 재시도 횟수: `{run_attempt}`")
          lines.append("")

          if changed:
              lines.append("### 변경 파일")
              for item in changed:
                  lines.append(f"- `{item}`")
              lines.append("")

          lines.append("### 리뷰 코멘트")
          if findings:
              lines.extend(findings)
          else:
              lines.append("- 변경된 운영 코드 범위에서 자동 리뷰 기준으로 바로 수정이 필요한 패턴은 발견되지 않았습니다.")
              lines.append("- 트랜잭션 경계, 동시성, 요구사항 충족 여부는 수동 리뷰로 한 번 더 확인하는 것을 권장합니다.")
          lines.append("")

          summary_path.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Create PR review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });

      - name: Fail job when tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
