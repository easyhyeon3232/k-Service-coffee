spring:
  application:
    name: coffee
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/coffee?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:coffee-order-consumer}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}

outbox:
  retry:
    delay-ms: ${OUTBOX_RETRY_DELAY_MS:2000}
    max-count: ${OUTBOX_MAX_RETRY_COUNT:3}

popular-menu:
  cache:
    ttl-seconds: ${POPULAR_MENU_CACHE_TTL_SECONDS:300}
  daily-key:
    ttl-days: ${POPULAR_MENU_DAILY_KEY_TTL_DAYS:8}

order-event:
  kafka:
    topic: ${ORDER_EVENT_KAFKA_TOPIC:coffee.order.created}
    dlt-topic: ${ORDER_EVENT_KAFKA_DLT_TOPIC:coffee.order.created.dlt}
    partitions: ${ORDER_EVENT_KAFKA_PARTITIONS:3}
    replication-factor: ${ORDER_EVENT_KAFKA_REPLICATION_FACTOR:1}
    consumer:
      group-id: ${ORDER_EVENT_KAFKA_CONSUMER_GROUP_ID:coffee-order-consumer}
      concurrency: ${ORDER_EVENT_KAFKA_CONCURRENCY:3}
      retry-interval-ms: ${ORDER_EVENT_KAFKA_RETRY_INTERVAL_MS:1000}
      retry-max-attempts: ${ORDER_EVENT_KAFKA_RETRY_MAX_ATTEMPTS:3}
