spring:
  application:
    name: coffee
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/coffee?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}

outbox:
  retry:
    delay-ms: ${OUTBOX_RETRY_DELAY_MS:2000}
    max-count: ${OUTBOX_MAX_RETRY_COUNT:3}

popular-menu:
  cache:
    ttl-seconds: ${POPULAR_MENU_CACHE_TTL_SECONDS:300}
  daily-key:
    ttl-days: ${POPULAR_MENU_DAILY_KEY_TTL_DAYS:8}
